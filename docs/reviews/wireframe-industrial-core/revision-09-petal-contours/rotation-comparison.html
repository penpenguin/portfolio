function frame(t){if(playing&&!document.hidden){if(last!==undefined)phase=(phase+(t-last)*Math.PI*2/16000)%(Math.PI*2);if(t-drawTime>=1000/30-.01){draw();drawTime=t;}}last=t;requestAnimationFrame(frame);}document.querySelector('#toggle').onclick=()=>{playing=!playing;last=undefined;document.querySelector('#toggle').textContent=playing?'停止':'再生'};document.querySelector('#stage').onchange=resize;document.querySelector('#mode').onchange=()=>{fitReport();draw();};document.addEventListener('visibilitychange',()=>last=undefined);window.setReviewPhase=p=>{phase=p;playing=false;draw();};resize();requestAnimationFrame(frame);
