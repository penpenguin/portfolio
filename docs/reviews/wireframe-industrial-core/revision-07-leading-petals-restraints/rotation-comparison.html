    const models = await Promise.all(
      assets.map(async (a) => ({ ...a, module: await import(a.url) }))
    );
    const main = document.querySelector('main');
    for (const m of models) {
      const f = document.createElement('figure');
      f.innerHTML = '<figcaption>' + m.label + '</figcaption><canvas></canvas>';
      main.append(f);
      m.canvas = f.querySelector('canvas');
      m.ctx = m.canvas.getContext('2d');
    }
    let phase = 0,
      playing = true,
      last,
      drawTime = -Infinity,
      width = 267,
      height = 258;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() {
      [width, height] = document
        .querySelector('#stage')
        .value.split(',')
        .map(Number);
      for (const m of models) {
        m.canvas.style.width = width + 'px';
        m.canvas.style.height = height + 'px';
        m.canvas.width = Math.round(width * dpr);
        m.canvas.height = Math.round(height * dpr);
        m.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        m.fit = m.module.createDeviceProjector(35).getFit(width, height);
      }
      const b = {
        left: Math.min(...models.map((m) => m.bounds.left)),
        right: Math.max(...models.map((m) => m.bounds.right)),
        bottom: Math.min(...models.map((m) => m.bounds.bottom)),
        top: Math.max(...models.map((m) => m.bounds.top)),
      };
      const scale =
        0.84 *
        Math.min(
          (width - 1.1) / (b.right - b.left),
          (height - 1.1) / (b.top - b.bottom)
        );
      const common = {
        scale,
        centerX: width / 2 - ((b.left + b.right) * scale) / 2,
        centerY: height / 2 + ((b.bottom + b.top) * scale) / 2,
      };
      for (const m of models)
        m.output = document.querySelector('#equal').checked ? common : m.fit;
      document.querySelector('#fits').textContent = JSON.stringify(
        models.map((m) => ({
          label: m.label,
          stage: [width, height],
          dpr,
          normalFit: m.fit,
          displayFit: m.output,
        })),
        null,
        2
      );
      draw();
    }
    function draw() {
      for (const m of models) {
        const c = m.ctx;
        c.clearRect(0, 0, width, height);
        c.strokeStyle = '#5B5A60';
        const f = m.fit,
          o = m.output;
        for (const l of m.module.projectDevice(
          m.start + phase,
          width,
          height
        )) {
          c.lineWidth = l.width;
          c.globalAlpha = l.opacity;
          c.beginPath();
          c.moveTo(
            ((l.from.x - f.centerX) / f.scale) * o.scale + o.centerX,
            ((l.from.y - f.centerY) / f.scale) * o.scale + o.centerY
          );
          c.lineTo(
            ((l.to.x - f.centerX) / f.scale) * o.scale + o.centerX,
            ((l.to.y - f.centerY) / f.scale) * o.scale + o.centerY
          );
          c.stroke();
        }
        c.globalAlpha = 1;
      }
      document.querySelector('#phase').textContent =
        'ワールド垂直Y軸位相 ' + ((phase * 180) / Math.PI).toFixed(1) + '°';
    }
    function frame(t) {
      if (playing) {
        if (last !== undefined)
          phase = (phase + ((t - last) * Math.PI * 2) / 16000) % (Math.PI * 2);
        if (t - drawTime >= 1000 / 30 - 0.01) {
          draw();
          drawTime = t;
        }
      }
      last = t;
      requestAnimationFrame(frame);
    }
    document.querySelector('#toggle').onclick = () => {
      playing = !playing;
      document.querySelector('#toggle').textContent = playing ? '停止' : '再生';
    };
    document.querySelector('#reset').onclick = () => {
      phase = 0;
      draw();
    };
    document.querySelector('#stage').onchange = resize;
    document.querySelector('#equal').onchange = resize;
    document.addEventListener('visibilitychange', () => {
      last = undefined;
    });
    window.reviewModels = models;
    window.setReviewPhase = (p) => {
      playing = false;
      phase = p;
      draw();
    };
    resize();
    requestAnimationFrame(frame);
  </script>
