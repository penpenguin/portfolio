<svg
  id="portfolio-favicon"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  viewBox="0 0 128 128"
  role="img"
  aria-labelledby="portfolio-favicon-title"
>
  <title id="portfolio-favicon-title">Portfolio favicon</title>
  <defs>
    <radialGradient
      id="portfolio-favicon-bg"
      cx="50%"
      cy="45%"
      r="70%"
      fx="30%"
      fy="30%"
    >
      <stop offset="0%" stop-color="#F5F7FD" />
      <stop offset="65%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#CBD5F5" />
    </radialGradient>
    <linearGradient
      id="portfolio-favicon-core"
      x1="46"
      y1="96"
      x2="92"
      y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient
      id="portfolio-neon-ribbon"
      x1="38"
      y1="110"
      x2="98"
      y2="30"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="portfolio-neon-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#portfolio-favicon-bg)" />
  <ellipse
    cx="70"
    cy="54"
    rx="46"
    ry="42"
    fill="url(#portfolio-neon-ribbon)"
    opacity="0.18"
  />
  <g filter="url(#portfolio-neon-glow)">
    <path
      d="M94 40c0-6.6-5.4-12-12-12H46a10 10 0 0 0-10 10v52c0 5.5 4.5 10 10 10h24c18.3 0 32-13.4 32-30.6 0-11.6-6.1-20-16-24.1l.6-5.3Z"
      fill="url(#portfolio-favicon-core)"
      opacity="0.94"
    />
  </g>
  <path
    d="M52 44h25c8.2 0 14 6 14 14.4S85.3 72 77 72H60v22H48V52c0-4.4 1.7-8 4-8Z"
    fill="#E2E8F0"
    opacity="0.95"
  />
  <path
    d="M40 94c12 8 44 4 52-6"
    stroke="#FF00F5"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
    filter="url(#portfolio-neon-glow)"
  />
  <circle cx="46" cy="42" r="6" fill="#22D3EE" opacity="0.85" />
  <circle cx="84" cy="86" r="5" fill="#FF00F5" opacity="0.6" />
</svg>
